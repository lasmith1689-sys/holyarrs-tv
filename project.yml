# XcodeGen spec for HolyArrs: one app for Apple TV (HolyArrsTV) and iPhone (HolyArrsPhone), same code
# (Sources/) and the same bundle ID, so both are one App Store Connect app. On a Mac:  brew install xcodegen && xcodegen generate
# Required environment variables (see README.md): APP_BUNDLE_ID, DEVELOPMENT_TEAM
name: HolyArrsTV
options:
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    SWIFT_VERSION: "5.0"
targets:
  HolyArrsTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Afterglow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        UILaunchScreen: {}
        # Plain HTTP to HolyArrs and the RTX server on the home LAN (IP addresses, so ATS exception domains
        # cannot be used). Fine for internal TestFlight testing.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to HolyArrs and the RTX 4K server on your PC.
        ITSAppUsesNonExemptEncryption: false
        # Top Shelf cards open afterglow://play?id=... (a film or episode) or afterglow://od?... (On Demand).
        CFBundleURLTypes:
          - CFBundleURLName: Afterglow
            CFBundleURLSchemes: [afterglow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        PRODUCT_NAME: HolyArrsTV
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: HolyArrsTopShelf  # Release 4: Continue Watching in the Apple TV's Top Shelf
    scheme:
      testTargets:
        - HolyArrsTVUITests
  # The Apple TV Top Shelf (TopShelf/ContentProvider.swift), embedded in HolyArrsTV.
  HolyArrsTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Afterglow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Shows Continue Watching from the RTX 4K server on your PC.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.topshelf
        PRODUCT_NAME: HolyArrsTopShelf
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # Simulator-only screen check (.github/workflows/ui-check.yml); never archived or uploaded.
  HolyArrsTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: HolyArrsTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: HolyArrsTV

  HolyArrsPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources-iOS/Assets.xcassets
    info:
      path: Resources-iOS/Info.plist
      properties:
        CFBundleDisplayName: Afterglow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        # Plain HTTP to HolyArrs and the RTX server on the home LAN; fine for internal TestFlight testing.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to HolyArrs, Sportarr and the RTX 4K server on your PC.
        # Keeps an AirPlay cast to an Apple TV going while the phone is locked.
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}
        PRODUCT_NAME: HolyArrsPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - HolyArrsPhoneUITests
  # Simulator-only screen check for iPhone; never archived or uploaded.
  HolyArrsPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests-iOS
    dependencies:
      - target: HolyArrsPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${APP_BUNDLE_ID}.phoneuitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: HolyArrsPhone
