name: TestFlight

# HolyArrs TV (tvOS client for HolyArrs): built on GitHub's Mac runner, signed with Apple's cloud
# signing and uploaded to TestFlight for internal testing only (.github/scripts/testflight.sh). Without the App
# Store Connect secrets it only compiles. Runs only when started by hand.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOLYARRS_BUNDLE_ID: ${{ vars.HOLYARRS_BUNDLE_ID || 'com.lasmith1689.holyarrstv' }}  # App Store Connect app record (tvOS)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode 26
        run: |
          xcode=$(for x in /Applications/Xcode_26*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
      - name: Install build tools
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          brew install xcodegen
      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # (the build number: run x 10 + attempt, growing with every upload and every re-run)
        run: BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT)) bash .github/scripts/testflight.sh
